[project]
name = "fluxium-ai-product-management-backend"
version = "0.1.0"
description = "Fluxium AI Product Management MVP backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "PyJWT>=2.10,<3.0",
    "cryptography>=44.0,<46.0",
    "pydantic-settings>=2.6,<3.0",
    "pymongo>=4.13,<5.0",
    "redis>=6.0,<7.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: requires a running local integration dependency",
]
