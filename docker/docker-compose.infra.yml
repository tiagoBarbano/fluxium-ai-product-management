  ollama:
    image: ollama/ollama:latest
    container_name: ollama-1
    restart: always

    runtime: nvidia

    ports:
      - "11434:11434"

    volumes:
      - ollama:/root/.ollama

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_ORIGINS: "*"

      # VS Code Agent
      OLLAMA_CONTEXT_LENGTH: "8192"

      # Manter modelo carregado na VRAM
      OLLAMA_KEEP_ALIVE: "-1"

      # Uma requisição por vez para maximizar recursos por sessão
      OLLAMA_NUM_PARALLEL: "1"

      # Apenas um modelo carregado
      OLLAMA_MAX_LOADED_MODELS: "1"

      # Reduz consumo do KV cache
      OLLAMA_KV_CACHE_TYPE: "q8_0"

      # Flash Attention
      OLLAMA_FLASH_ATTENTION: "1"

      # NVIDIA
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility